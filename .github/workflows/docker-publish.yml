name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main # Trigger only on pushes to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx unlocks BuildKit features, enabling the GHA caching below

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags the image with 'latest' and the specific Git commit SHA for version control
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/student-profile-app:latest
            ${{ secrets.DOCKER_USERNAME }}/student-profile-app:${{ github.sha }}
          # Dramatically speeds up future builds by caching Docker layers in GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max
